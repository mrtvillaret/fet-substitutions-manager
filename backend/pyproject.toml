# Configuració de les eines de qualitat del backend.
#   ruff check .

[tool.ruff]
# La versió de la imatge Docker (Dockerfile: python:3.13-slim).
target-version = "py313"
extend-exclude = ["venv*", "data*", "exports"]
# i18n_setup instal·la la funció de traducció a builtins.
builtins = ["_"]

[tool.ruff.lint]
# Regles bàsiques ara (errors, imports, bugbear); UP i SIM, més endavant.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
    # FastAPI declara les dependències com a valor per defecte: Depends(...).
    "B008",
    # Diverses sentències en una línia: les separa `ruff format`, que es farà
    # en un commit propi a l'inici de la fase 2. Llavors es treu d'aquí.
    "E701",
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# Els fixtures de pytest s'importen i es reben com a paràmetre amb el mateix nom.
"tests/**" = ["F811"]
# Imports que han d'anar després d'alguna cosa:
# main.py, després de load_dotenv() (config.auth llegeix l'entorn en importar-se);
"main.py" = ["E402"]
# conftest.py, després de fixar DATA_DIR i AUTH_DB_PATH;
"tests/conftest.py" = ["E402"]
# i aquest test, que també s'executa sol (unittest), després d'afegir backend/ al sys.path.
"tests/test_scheduler_regression.py" = ["E402"]
