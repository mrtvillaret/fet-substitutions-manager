# Proves i lint de cada push i pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # La versió de la imatge Docker (backend/Dockerfile)
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # pdftotext: els tests del PDF en llegeixen el text (sense, s'ometen)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Els tests creen centres temporals amb l'horari de data/exemple/
      - run: python -m pytest -q -n auto --dist loadscope -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La versió de la imatge Docker (frontend/Dockerfile)
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Funcions pures (tests/*.test.js, node --test)
      - run: npm test
      - run: npm run build

  auditoria:
    # Vulnerabilitats conegudes de les dependències. Totes les troballes surten
    # al resum; les ja conegudes i justificades (backend/pip-audit-excepcions.txt)
    # queden com a avís, i qualsevol altra fa fallar el job.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          # 1) Informe complet, excepcions incloses (no falla aquí)
          pip-audit -r requirements.txt -r requirements-dev.txt --desc off -f markdown > "$RUNNER_TEMP/pip-audit.md" || true
          { echo '### pip-audit (totes les troballes)'; cat "$RUNNER_TEMP/pip-audit.md"; } >> "$GITHUB_STEP_SUMMARY"
          # 2) Falla només per les que no són a la llista d'excepcions
          mapfile -t ignora < <(sed -e 's/#.*//' -e 's/[[:space:]]//g' pip-audit-excepcions.txt | grep -v '^$' | sed 's/^/--ignore-vuln=/')
          echo "::warning title=pip-audit::${#ignora[@]} vulnerabilitats conegudes amb excepció (backend/pip-audit-excepcions.txt)"
          pip-audit -r requirements.txt -r requirements-dev.txt --desc off "${ignora[@]}"
      - name: npm audit (frontend, dependències de producció)
        working-directory: frontend
        # Només llegeix el package-lock.json: no cal npm ci
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Cap prova de navegador alhora que les suites.
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      E2E_PYTHON: python
    steps:
      - name: Inicia la mesura del job
        id: inici
        working-directory: ${{ github.workspace }}
        run: echo "instant=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instal·la les dependències del backend i del frontend
        run: |
          python -m pip install -r ../backend/requirements.txt -r ../backend/requirements-dev.txt
          npm ci
      - name: Recupera Chromium de la cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
      - name: Instal·la Chromium i les dependències del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          npx playwright install --with-deps chromium
      # Contra el build de producció servit amb `vite preview`, no contra el
      # servidor de desenvolupament (en local, `npm run e2e` el continua fent servir)
      - name: Executa els vuit casos de navegador (build servit)
        run: |
          inici=$SECONDS
          codi=0
          npm run e2e:build || codi=$?
          durada=$((SECONDS - inici))
          printf 'Proves e2e (build i serveis inclosos): %s s; sortida %s.\n' "$durada" "$codi" >> "$GITHUB_STEP_SUMMARY"
          exit "$codi"
      - name: Desa les captures, traces i l'informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fallada
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - name: Resumeix el temps total del job
        if: always()
        env:
          INICI: ${{ steps.inici.outputs.instant }}
        run: |
          if [ -n "$INICI" ]; then
            durada=$(( $(date +%s) - INICI ))
            printf 'Job e2e (preparació i proves): %s s.\n' "$durada" >> "$GITHUB_STEP_SUMMARY"
          fi
